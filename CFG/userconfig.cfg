// ============================================================
// userconfig.cfg - personal aliases / UI preferences
// Never commit passwords, RCON or setinfo _pw here.
// ============================================================

alias +status "+showscores; net_graph 3; hud_saytext 1"
alias -status "-showscores; net_graph 0; hud_saytext 0"
bind "TAB" "+status"

bind "n" "amxmodmenu"

// CROSSHAIR
cl_crosshair_color "255 255 255"
cl_crosshair_size "medium"
cl_crosshair_translucent "0"

// CLASSIC MENUS / LANGUAGE
setinfo "_vgui_menus" "0"
setinfo "_ah" "0"
setinfo "lang" "es"

echo "[CFG] userconfig.cfg loaded"
