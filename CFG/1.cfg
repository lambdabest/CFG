// ============================================================
// 1.cfg - MAIN CLIENT CONFIG
// Launch: +exec 1.cfg
// ============================================================

unbindall

// MOVEMENT
bind "w" "+forward"
bind "s" "+back"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "SPACE" "+jump"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"

// COMBAT
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "r" "+reload"
bind "q" "lastinv"
bind "g" "drop"
bind "e" "+use"
bind "f" "stopsound"

// Wheel: jump is allowed; duck-on-wheel is intentionally not used.
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" ""

// WEAPONS / BUY
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
bind "," "buyammo1"
bind "." "buyammo2"
bind "b" "buy"
bind "o" "buyequip"
bind "F1" "autobuy"
bind "F2" "rebuy"

// COMMUNICATION / MENU
bind "y" "messagemode"
bind "u" "messagemode2"
bind "k" "+voicerecord"
bind "MOUSE5" "+voicerecord"
bind "m" "chooseteam"
bind "c" "radio3"
bind "x" "radio2"
bind "z" "radio1"
bind "t" "impulse 201"

// CONSOLE / UI
bind "`" "toggleconsole"
bind "~" "toggleconsole"
bind "ALT" "toggleconsole"
bind "ESCAPE" "cancelselect"

// PERSONAL
name "LAMBDA[MGTA]"
sensitivity "0.346875"
zoom_sensitivity_ratio "0.68"
volume "0.03"
brightness "2"
gamma "3"
default_fov "90"
viewsize "120"
con_color "255 255 255"

violence_ablood "1"
violence_agibs "1"
violence_hblood "1"
violence_hgibs "1"

voice_enable "1"
voice_forcemicrecord "1"
voice_modenable "1"
voice_scale "0.25"

+mlook

exec "competitive_240hz.cfg"
exec "userconfig.cfg"

echo "[CFG] 1.cfg loaded"
