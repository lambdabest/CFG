// ============================================================
// competitive_240hz.cfg
// CS 1.6 Steam client - 240 Hz / managed LAN
// ============================================================

// FPS / DISPLAY
fps_override "1"
fps_max "240"
gl_vsync "0"

// NETWORK
// LAN policy: cl_cmdrate = fps_max + 5.
rate "100000"
cl_updaterate "102"
cl_cmdrate "245"
cl_cmdbackup "0"
ex_interp "0.01"

// Managed LAN only: lets the trusted LAN server normalize allowed client CVARs.
// Use: exec public_safe.cfg before joining untrusted/public servers.
cl_filterstuffcmd "0"

// PREDICTION / CLIENT CLOCK
cl_lc "1"
cl_lw "1"
cl_clockreset "0.1"
cl_fixtimerate "7.5"
clockwindow "0.5"
cl_nosmooth "0"
cl_smoothtime "0.1"
cl_solid_players "1"
cl_vsmoothing "0"
r_bmodelinterp "1"

// CONNECTION STABILITY
cl_resend "6"
cl_timeout "60"

// MOVEMENT
cl_backspeed "400"
cl_forwardspeed "400"
cl_sidespeed "400"
cl_upspeed "320"

// MOUSE - RAW INPUT / NO IN-GAME ACCELERATION
m_rawinput "1"
m_filter "0"
m_customaccel "0"

// Reset the old 1 ms threaded-mouse tweak.
// With Raw Input active this threaded cursor path is not used.
m_mousethread_sleep "10"

m_pitch "0.022"
m_yaw "0.022"
m_forward "1"
m_side "0.8"
lookspring "0"
lookstrafe "0"
joystick "0"

// RENDER / VISIBILITY
gl_keeptjunctions "1"
gl_lightholes "1"
gl_spriteblend "1"
gl_max_size "512"
gl_picmip "0"
gl_monolights "0"
gl_overbright "1"
gl_fog "0"
gl_texturemode "GL_LINEAR_MIPMAP_LINEAR"
gl_ztrick_old "0"

r_detailtextures "0"
r_drawviewmodel "1"
r_dynamic "1"

fastsprites "0"
cl_weather "0"
cl_shadows "0"
cl_corpsestay "0"

max_shells "120"
max_smokepuffs "120"
mp_decals "300"

// AUDIO
_snd_mixahead "0.1"
snd_noextraupdate "1"
hisound "1"
MP3Volume "0"
bgmvolume "0"

// GAMEPLAY / HUD
_cl_autowepswitch "0"
cl_dynamiccrosshair "0"
cl_righthand "1"
cl_radartype "1"
cl_minmodels "1"
cl_min_ct "4"
cl_min_t "5"
hud_fastswitch "2"
hud_centerid "1"

net_graph "0"
net_graphpos "2"
net_scale "1000"

echo "[CFG] competitive_240hz.cfg loaded"
